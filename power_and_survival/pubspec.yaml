name: power_and_survival
description: "Power & Survival: President Simulator - A complete president simulation game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  audioplayers: ^5.2.1
  fl_chart: ^0.66.2
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
